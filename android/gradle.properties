# --- Gradle -----------------------------------------------------------------
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- Android ----------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# --- AfyaLink release identity (single source of truth) ----------------------
# The release workflow overrides these with -Pafyalink.versionName / -Pafyalink.versionCode
afyalink.versionName=1.1.1
afyalink.versionCode=3
